[project]
name = "hexbench"
version = "0.1.0"
description = "Deterministic HEXUDON test generation, grading, and deployment"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pytorch-triton-rocm>=3.5.1",
  "torch>=2.9.1",
  "torchaudio>=2.9.1",
  "torchvision>=0.24.1",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "hypothesis>=6.100"]

[project.scripts]
hexbench = "hexbench.cli:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/rocm6.3"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexbench"]
include = [
  "hexbench/static/*.html",
  "hexbench/static/*.css",
  "hexbench/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
