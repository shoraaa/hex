[project]
name = "hexbench"
version = "0.1.0"
description = "Deterministic HEXUDON test generation, grading, and deployment"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "torch>=2.9.1,<2.10",
  "torchaudio>=2.9.1,<2.10",
  "torchvision>=0.24.1,<0.25",
  "tqdm>=4.69.0",
]

[project.scripts]
hexbench = "hexbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexbench"]
include = [
  "hexbench/static/*.html",
  "hexbench/static/*.css",
  "hexbench/static/*.js",
]
