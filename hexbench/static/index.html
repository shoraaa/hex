<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>HEXUDON Planner</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .parameter-boolean { padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; }
    .parameter-boolean label { display:flex; align-items:center; gap:8px; color:var(--ink); font-weight:700; }
    .parameter-boolean input { width:auto; }
    .parameter-boolean small { display:block; margin-top:5px; color:var(--muted); line-height:1.35; }
    .planner-parameters { margin-top:10px; }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="icon-button mobile-menu" aria-label="Menu">☰</button>
    <a class="procon-brand" href="/"><span class="procon-mark">PRO<br>CON</span><strong>PROCON 2026</strong></a>
    <nav class="main-nav" aria-label="Workspace">
      <a id="competition-nav" class="nav-link" href="/">Competition</a>
      <a id="local-nav" class="nav-link" href="/local">LOCAL</a>
    </nav>
    <span class="top-spacer"></span>
    <span id="connection" class="connection"><i></i><span>API</span></span>
    <button id="locale-button" class="locale-button">🇻🇳 <span>vi</span></button>
    <span id="team-badge" class="team-badge">HEX</span>
  </header>

  <main id="app" class="page-shell" aria-live="polite">
    <section class="loading-screen"><div class="spinner"></div><p>Loading HEXUDON…</p></section>
  </main>

  <div id="toast-stack" class="toast-stack" aria-live="assertive"></div>
  <div id="modal-root"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
